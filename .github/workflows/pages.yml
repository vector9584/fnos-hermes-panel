name: Deploy promo page

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'favicon-*.png'
      - 'favicon.ico'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 宣传页是自包含单文件（内联 CSS、无外链依赖），只发布它
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp favicon-16.png favicon-32.png favicon-180.png favicon-192.png favicon-512.png favicon.ico _site/
          ls -l _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
